# sing-box Generic Template with Rule Sets
# Place in: <config>/sing-box/templates/generic_tpl_with_rulest.yaml
#
# Advanced template with:
#   - Multiple proxy-provider slots (generic + region-specific)
#   - Multi-level proxy groups (select → url-test → nodes)
#   - Comprehensive rule-set based routing
#   - Streaming/media domain rules
#   - AI/chat service routing
#
# Usage: Select this template in the Template tab, press Enter.
#   - Enter a profile name
#   - Enter subscription URLs (comma-separated), e.g.:
#     https://sub1.example.com,https://sub2.example.com
#
# Each URL becomes pvd0, pvd1, ... nodes.

proxy-providers:
  # Generic provider slot — all subscription URLs go here
  pvd:
    tpl_param:
    type: http
    interval: 3600
    url: https://example.com/subscription.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  # --- Top-level selector ---
  - name: Entry
    type: select
    proxies:
      - <Auto>
      - <Streaming>
      - <AI>
      - DIRECT
      - REJECT

  # --- Auto-select (fastest node from all providers) ---
  - name: Auto
    type: url-test
    tpl_param:
      providers:
        - pvd
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # --- Streaming media group ---
  - name: Streaming
    type: select
    proxies:
      - <StreamAuto>
      - DIRECT

  - name: StreamAuto
    type: url-test
    tpl_param:
      providers:
        - pvd
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 100

  # --- AI / Chat services group ---
  - name: AI
    type: select
    proxies:
      - <AIAuto>
      - <Auto>
      - DIRECT

  - name: AIAuto
    type: url-test
    tpl_param:
      providers:
        - pvd
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50

  # --- Direct (no proxy) ---
  - name: Direct
    type: select
    proxies:
      - DIRECT

rules:
  # ===== LAN / Private / Bogon =====
  - IP-CIDR,127.0.0.0/8,Direct
  - IP-CIDR,10.0.0.0/8,Direct
